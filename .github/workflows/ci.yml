name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test:unit

      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level=high

      - name: Build production applications
        run: pnpm build
        env:
          BLOG_ORIGIN: https://blog.example.invalid
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_BLOG_URL: https://portfolio.example.invalid/blog
          NEXT_PUBLIC_PORTFOLIO_URL: https://portfolio.example.invalid
          NEXT_PUBLIC_SITE_URL: https://portfolio.example.invalid

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @portfolio/web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.project }} cross-zone tests
        run: pnpm --filter @portfolio/web exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ matrix.project }}-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Lint, test, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - static-quality
      - e2e

    steps:
      - name: Enforce all quality results
        env:
          STATIC_RESULT: ${{ needs.static-quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "Static quality: ${STATIC_RESULT}"
          echo "Browser matrix: ${E2E_RESULT}"
          test "${STATIC_RESULT}" = "success"
          test "${E2E_RESULT}" = "success"
