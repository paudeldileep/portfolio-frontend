name: Deployment Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public portfolio origin to verify
        required: true
        default: https://iamdileep.vercel.app
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Verify public portfolio and blog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run deployment smoke checks
        run: node scripts/smoke-deployment.mjs
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
